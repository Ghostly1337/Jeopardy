name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.transport == 'relay' && 'Relay/Vercel' || 'WebRTC' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Alle Browser-Tests laufen einmal über WebRTC und einmal über das Relay (Vercel)
        transport: [peer, relay]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium für Playwright installieren
        run: npx playwright install --with-deps chromium
      - name: Unit-Tests
        if: matrix.transport == 'peer'
        run: npm run test:unit
      - name: Browser-Tests
        run: npm run test:e2e
        env:
          E2E_TRANSPORT: ${{ matrix.transport }}

