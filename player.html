<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jeopardy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="player-body">
  <div class="topleft">
    <button class="small me-btn" id="me" hidden></button>
  </div>
  <div class="topright">
    <button class="small sound-btn" id="fullBtn" hidden title="Vollbild">⛶</button>
    <button class="small sound-btn" id="sound">🔇 Ton aktivieren</button>
    <div class="status bad" id="status">verbinde…</div>
  </div>
  <div class="player-page">
    <div class="waiting" id="waiting">Verbinde mit dem Spiel…</div>
    <div class="turn-banner" id="turnBanner" hidden></div>
    <div class="board" id="board" hidden></div>
    <div class="scores" id="scores"></div>
  </div>

  <div class="clue-overlay" id="overlay">
    <div class="clue-meta" id="meta"></div>
    <div class="timer big" id="timerBox" hidden>
      <div class="timer-track"><div class="timer-fill"></div></div>
      <span class="timer-num"></span>
    </div>
    <img class="clue-img" id="img" alt="" hidden>
    <div class="clue-text" id="q"></div>
    <div class="clue-answer" id="a"></div>
    <div class="hint-box" id="hintBox" hidden></div>
    <div class="special-box" id="specialBox" hidden></div>
    <div class="buzz-area">
      <button class="buzzer" id="buzzer" hidden>BUZZ</button>
      <div class="buzz-info" id="buzzInfo" hidden></div>
      <div class="joker-bar" id="jokerBar" hidden></div>
    </div>
    <div class="scores" id="overlayScores"></div>
  </div>

  <div class="react-bar" id="reactBar" hidden></div>

  <div class="buzz-show" id="buzzShow"><div class="buzz-show-name"></div></div>

  <div class="intro" id="intro">
    <div class="intro-inner">
      <div class="intro-kicker"></div>
      <div class="intro-title"></div>
      <div class="intro-sub"></div>
    </div>
  </div>

  <div class="finish" id="finish">
    <div class="finish-inner"><div id="podium"></div></div>
  </div>

  <div class="picker" id="picker" hidden>
    <div class="picker-card">
      <h2 id="pickerTitle">Wer bist du?</h2>
      <p class="picker-error" id="pickerError" hidden></p>
      <p class="picker-empty" id="pickerEmpty" hidden>Der Host hat noch keine Spieler angelegt. Warte kurz – dein Name erscheint hier automatisch.</p>
      <label class="picker-name" id="pickerNameRow" hidden>Dein Name
        <input id="pickerName" maxlength="24" autocomplete="nickname" placeholder="z. B. Anna">
      </label>
      <div class="picker-list" id="pickerList"></div>
      <div class="picker-alt">
        <button class="ghost" id="tvView">📺 TV-Ansicht</button>
        <button class="ghost" id="watchOnly">👀 Nur zuschauen</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/net.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
