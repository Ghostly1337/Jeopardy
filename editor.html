<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jeopardy Editor</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("jeopardy.theme")||"graphit"}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="editor">
    <div class="topbar">
      <a href="index.html" class="logo" style="font-size:34px;text-decoration:none">JEOPARDY<span>!</span></a>
      <div class="spacer"></div>
      <span class="saved" id="saved"></span>
      <button id="export">Export</button>
      <button id="importBtn" type="button">Import</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <button class="ghost" id="reset">Zurücksetzen</button>
      <a class="btn primary" href="host.html">Zum Host-Pult →</a>
    </div>

    <section class="card setbar" id="setBar">
      <div class="row setbar-row">
        <label for="setSelect">Fragenset</label>
        <select id="setSelect" disabled><option>Lädt…</option></select>
        <button class="small" id="setNew" type="button">＋ Neu</button>
        <button class="small" id="setDup" type="button">Duplizieren</button>
        <button class="small" id="setRename" type="button">Umbenennen</button>
        <button class="small ghost" id="setDel" type="button">Löschen</button>
        <span class="set-source" id="setSource"></span>
      </div>
      <form class="row setbar-row" id="pwForm" hidden>
        <label for="hostPw">Host-Passwort</label>
        <input id="hostPw" type="password" autocomplete="current-password" placeholder="für gespeicherte Sets">
        <button class="primary small" type="submit">Entsperren</button>
        <span class="hint" id="pwError"></span>
      </form>
    </section>

    <input id="title" class="title-field" placeholder="Titel des Spiels">

    <div class="tabs seg">
      <button data-round="0">Runde 1 · 100–500</button>
      <button data-round="1">Runde 2 · 200–1000</button>
    </div>
    <p class="hint">Oberes Feld: Frage bzw. Hinweis, den die Spieler sehen. Gelbes Feld: Antwort (sehen die Spieler nach dem Aufdecken). Host-Notiz: z. B. „auch richtig: …“ – sieht nur du. Alles wird automatisch gespeichert.</p>

    <div class="ed-grid" id="grid" style="margin-top:16px"></div>
  </main>
  <script src="js/common.js"></script>
  <script src="js/sets.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
