<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com; media-src 'self' data: blob: https:; object-src 'none'; base-uri 'none'; form-action 'self'; worker-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jeopardy</title>
  <script src="js/theme-init.js"></script>
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="home">
    <h1 class="logo">JEOPARDY<span>!</span></h1>
    <p class="tagline">Das Quiz für eure Runde – live auf jedem Gerät.</p>

    <div class="card">
      <h2>Mitspielen</h2>
      <form class="row" id="joinForm">
        <input id="code" maxlength="6" placeholder="CODE" autocomplete="off" required>
        <button class="primary" type="submit">Beitreten</button>
      </form>
    </div>

    <div class="card">
      <h2>Spielleitung</h2>
      <div class="row">
        <a class="btn primary" href="host.html">Spiel hosten</a>
        <a class="btn" href="editor.html">Fragen bearbeiten</a>
      </div>
      <p class="hint">Fragen und Spielstand werden nur in deinem Browser gespeichert.</p>
    </div>
  </main>
  <script src="js/index.js"></script>
</body>
</html>
