<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jeopardy Editor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="editor">
    <div class="topbar">
      <a href="index.html">← Start</a>
      <div class="spacer"></div>
      <span class="saved" id="saved"></span>
      <button id="export">Export (.json)</button>
      <button id="importBtn" type="button">Import (.json)</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <button class="ghost" id="reset">Alles zurücksetzen</button>
      <a href="host.html"><button class="gold" type="button">Zum Host-Pult</button></a>
    </div>

    <label>Titel <input id="title"></label>

    <div class="tabs">
      <button data-round="0" class="active">Runde 1 (100–500)</button>
      <button data-round="1">Runde 2 (200–1000)</button>
    </div>
    <p class="hint">Weißes Feld: Frage/Hinweis, den die Spieler sehen. Gelbes Feld: Antwort, die nur du im Host-Pult siehst. Änderungen werden automatisch gespeichert.</p>

    <div class="ed-grid" id="grid"></div>
  </main>
  <script src="js/common.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
