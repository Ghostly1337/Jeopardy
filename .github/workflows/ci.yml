name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.transport == 'relay' && 'Relay/Vercel' || matrix.transport == 'ws' && 'WebSocket/eigener Server' || 'WebRTC' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Alle Browser-Tests laufen über WebRTC, über das HTTP-Relay (Vercel) und über das
        # WebSocket-Relay (eigener Server, server.mjs)
        transport: [peer, relay, ws]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Bekannte Sicherheitslücken in Laufzeit-Abhängigkeiten lassen die CI scheitern
      - name: Sicherheits-Audit (Laufzeit-Abhängigkeiten)
        if: matrix.transport == 'peer'
        run: npm audit --omit=dev --audit-level=moderate
      - name: Chromium für Playwright installieren
        run: npx playwright install --with-deps chromium
      - name: Unit-Tests
        if: matrix.transport == 'peer'
        run: npm run test:unit
      - name: Browser-Tests
        run: npm run test:e2e
        env:
          E2E_TRANSPORT: ${{ matrix.transport }}

