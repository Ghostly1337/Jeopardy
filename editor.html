<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jeopardy Editor</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("jeopardy.theme")||"graphit"}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="editor">
    <div class="topbar">
      <a href="index.html" class="logo" style="font-size:34px;text-decoration:none">JEOPARDY<span>!</span></a>
      <div class="spacer"></div>
      <span class="saved" id="saved"></span>
      <button id="export">Export</button>
      <button id="importBtn" type="button">Import</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <button class="ghost" id="reset">Zurücksetzen</button>
      <a class="btn primary" href="host.html">Zum Host-Pult →</a>
    </div>

    <input id="title" class="title-field" placeholder="Titel des Spiels">

    <div class="tabs seg">
      <button data-round="0">Runde 1 · 100–500</button>
      <button data-round="1">Runde 2 · 200–1000</button>
    </div>
    <p class="hint">Oberes Feld: Frage bzw. Hinweis, den die Spieler sehen. Gelbes Feld: Antwort (sehen die Spieler nach dem Aufdecken). Host-Notiz: z. B. „auch richtig: …“ – sieht nur du. Alles wird automatisch gespeichert.</p>

    <div class="ed-grid" id="grid" style="margin-top:16px"></div>
  </main>
  <script src="js/common.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
